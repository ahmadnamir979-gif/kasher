crons:
  - name: debt-reminders-daily
    description: "Promotes pending debt reminders to 'due' each morning for shop owners"
    cron: "0 6 * * *"
    timezone: "Asia/Jerusalem"
    endpoint: "{{BASE_URL}}/api/cron/debt-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
