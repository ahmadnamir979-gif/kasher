crons:
  - name: debt-reminders-daily
    description: "Promotes pending debt reminders to 'due' each morning for shop owners"
    cron: "0 6 * * *"
    timezone: "Asia/Jerusalem"
    endpoint: "{{BASE_URL}}/api/cron/debt-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true

  - name: ai-insights-daily
    description: "Computes smart proactive alerts (sales trends, low stock, cash, checks) for every active shop"
    cron: "0 7 * * *"
    timezone: "Asia/Jerusalem"
    endpoint: "{{BASE_URL}}/api/cron/ai-insights"
    method: GET
    enabled: true
